<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вхід — Optimistic Optimiser</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>

    <main class="login-page">

        <section class="login-card">

            <a href="index.html" class="back-link">
                <span aria-hidden="true">←</span>
                На головну
            </a>

            <div class="login-logo-wrap">
                <img
                    src="images/logo.png"
                    alt="Логотип Optimistic Optimiser"
                    class="login-logo"
                >
            </div>

            <div class="label">
                <span class="label-dot"></span>
                Особистий кабінет
            </div>

            <h1>
                З поверненням
                <span>до вашої енергії</span>
            </h1>

            <p class="login-subtitle">
                Увійдіть, щоб керувати сонячними панелями
                та домашньою батареєю.
            </p>

            <form class="login-form" id="login-form">

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Пароль</label>

                    <div class="password-wrap">
                        <input
                            id="password"
                            type="password"
                            placeholder="Введіть пароль"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-password"
                            aria-label="Показати пароль"
                        >
                            Показати
                        </button>
                    </div>
                </div>

                <button class="primary-button login-button" type="submit">
                    Увійти
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <p class="login-footer">
                Ще немає акаунта?
                <a href="register.html">Створити акаунт</a>
            </p>

        </section>

    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');

        toggleButton.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';

            passwordInput.type = isHidden ? 'text' : 'password';
            toggleButton.textContent = isHidden ? 'Сховати' : 'Показати';
            toggleButton.setAttribute(
                'aria-label',
                isHidden ? 'Сховати пароль' : 'Показати пароль'
            );
        });

        document.getElementById('login-form').addEventListener('submit', (event) => {
            event.preventDefault();
            // TODO: тут буде запит на сервер для входу
        });
    </script>

</body>
</html>
