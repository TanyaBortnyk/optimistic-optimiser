<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Реєстрація — Optimistic Optimiser</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>

    <main class="login-page">

        <section class="login-card register-card">

            <a href="index.html" class="back-link">
                <span aria-hidden="true">←</span>
                На головну
            </a>

            <div class="login-logo-wrap">
                <img
                    src="images/logo.png"
                    alt="Логотип Optimistic Optimiser"
                    class="login-logo"
                >
            </div>

            <div class="label">
                <span class="label-dot"></span>
                Новий акаунт
            </div>

            <h1>
                Почніть керувати
                <span>енергією розумніше</span>
            </h1>

            <p class="login-subtitle">
                Створіть акаунт, щоб підключити сонячні панелі
                та домашню батарею.
            </p>

            <form class="login-form" id="register-form" novalidate>

                <div class="field">
                    <label for="name">Ім'я</label>
                    <input
                        id="name"
                        type="text"
                        placeholder="Ваше ім'я"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Пароль</label>

                    <div class="password-wrap">
                        <input
                            id="password"
                            type="password"
                            placeholder="Мінімум 8 символів"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password"
                            aria-label="Показати пароль"
                        >
                            Показати
                        </button>
                    </div>

                    <div class="strength" aria-live="polite">
                        <div class="strength-bars">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <small id="strength-text">Введіть пароль</small>
                    </div>
                </div>

                <div class="field">
                    <label for="password-repeat">Повторіть пароль</label>

                    <div class="password-wrap">
                        <input
                            id="password-repeat"
                            type="password"
                            placeholder="Ще раз той самий пароль"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="password-repeat"
                            aria-label="Показати пароль"
                        >
                            Показати
                        </button>
                    </div>

                    <small class="field-error" id="repeat-error" hidden>
                        Паролі не збігаються
                    </small>
                </div>

                <label class="checkbox">
                    <input type="checkbox" id="terms" required>
                    <span class="checkbox-box" aria-hidden="true">✓</span>
                    <span class="checkbox-text">
                        Я погоджуюсь з <a href="#">умовами використання</a>
                        та <a href="#">політикою конфіденційності</a>
                    </span>
                </label>

                <button class="primary-button login-button" type="submit">
                    Створити акаунт
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <p class="login-footer">
                Вже маєте акаунт?
                <a href="login.html">Увійти</a>
            </p>

        </section>

    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const repeatInput = document.getElementById('password-repeat');
        const repeatError = document.getElementById('repeat-error');
        const strengthText = document.getElementById('strength-text');
        const strengthBars = document.querySelector('.strength-bars');

        // Показати / сховати пароль
        document.querySelectorAll('.toggle-password').forEach((button) => {
            button.addEventListener('click', () => {
                const input = document.getElementById(button.dataset.target);
                const isHidden = input.type === 'password';

                input.type = isHidden ? 'text' : 'password';
                button.textContent = isHidden ? 'Сховати' : 'Показати';
                button.setAttribute(
                    'aria-label',
                    isHidden ? 'Сховати пароль' : 'Показати пароль'
                );
            });
        });

        // Надійність пароля
        const levels = [
            { text: 'Введіть пароль', level: 0 },
            { text: 'Слабкий', level: 1 },
            { text: 'Середній', level: 2 },
            { text: 'Добрий', level: 3 },
            { text: 'Надійний', level: 4 }
        ];

        function getScore(value) {
            if (!value) return 0;

            let score = 0;

            if (value.length >= 8) score++;
            if (/[a-zа-яіїєґ]/.test(value) && /[A-ZА-ЯІЇЄҐ]/.test(value)) score++;
            if (/\d/.test(value)) score++;
            if (/[^\p{L}\d]/u.test(value)) score++;

            return Math.max(score, 1);
        }

        passwordInput.addEventListener('input', () => {
            const score = getScore(passwordInput.value);

            strengthBars.dataset.level = levels[score].level;
            strengthText.textContent = levels[score].text;

            checkRepeat();
        });

        // Збіг паролів
        function checkRepeat() {
            const mismatch =
                repeatInput.value !== '' &&
                repeatInput.value !== passwordInput.value;

            repeatError.hidden = !mismatch;
            repeatInput.classList.toggle('is-invalid', mismatch);

            return !mismatch;
        }

        repeatInput.addEventListener('input', checkRepeat);

        // Відправка форми
        document.getElementById('register-form').addEventListener('submit', (event) => {
            event.preventDefault();

            if (!event.target.checkValidity() || !checkRepeat()) {
                event.target.reportValidity();
                return;
            }

            // TODO: тут буде запит на сервер для реєстрації
        });
    </script>

</body>
</html>
