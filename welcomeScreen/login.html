<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вхід — Optimistic Optimiser</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="auth.js"></script>
</head>

<body>

    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>

    <main class="login-page">

        <section class="login-card">

            <a href="index.html" class="back-link">
                <span aria-hidden="true">←</span>
                На головну
            </a>

            <div class="login-logo-wrap">
                <img
                    src="images/logo.png"
                    alt="Логотип Optimistic Optimiser"
                    class="login-logo"
                >
            </div>

            <div class="label">
                <span class="label-dot"></span>
                Особистий кабінет
            </div>

            <h1>
                З поверненням
                <span>до вашої енергії</span>
            </h1>

            <p class="login-subtitle">
                Увійдіть, щоб керувати сонячними панелями
                та домашньою батареєю.
            </p>

            <form class="login-form" id="login-form" novalidate>

                <div class="form-alert" id="login-alert" role="alert" hidden></div>

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        type="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Пароль</label>

                    <div class="password-wrap">
                        <input
                            id="password"
                            type="password"
                            placeholder="Введіть пароль"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="toggle-password"
                            aria-label="Показати пароль"
                        >
                            Показати
                        </button>
                    </div>
                </div>

                <button class="primary-button login-button" type="submit">
                    Увійти
                    <span aria-hidden="true">→</span>
                </button>

            </form>

            <p class="login-footer">
                Ще немає акаунта?
                <a href="register.html">Створити акаунт</a>
            </p>

        </section>

    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const toggleButton = document.getElementById('toggle-password');

        toggleButton.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';

            passwordInput.type = isHidden ? 'text' : 'password';
            toggleButton.textContent = isHidden ? 'Сховати' : 'Показати';
            toggleButton.setAttribute(
                'aria-label',
                isHidden ? 'Сховати пароль' : 'Показати пароль'
            );
        });

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const loginAlert = document.getElementById('login-alert');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            hideAlert(loginAlert);

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email) {
                showAlert(loginAlert, 'Введіть email');
                return emailInput.focus();
            }
            if (!isValidEmail(email)) {
                showAlert(loginAlert, 'Некоректний формат email');
                return emailInput.focus();
            }
            if (!password) {
                showAlert(loginAlert, 'Введіть пароль');
                return passwordInput.focus();
            }

            const button = loginForm.querySelector('button[type="submit"]');
            setLoading(button, true, 'Входимо…');

            const { error } = await sb.auth.signInWithPassword({ email, password });

            if (error) {
                setLoading(button, false);
                showAlert(loginAlert, translateError(error));
                return;
            }

            showAlert(loginAlert, 'Вхід виконано! Переходимо…', 'success');
            setTimeout(() => {
                window.location.href = REDIRECT_AFTER_LOGIN;
            }, 700);
        });
    </script>

</body>
</html>
